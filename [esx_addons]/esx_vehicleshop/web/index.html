<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Dealership</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main id="shop" hidden>
            <header>
                <div class="identity">
                    <div class="brand-mark" aria-hidden="true">
                        <img src="assets/esx-logo.png" width="800" height="300" alt="" />
                    </div>
                    <div>
                        <img id="logo" alt="" hidden />
                        <span id="brand"></span>
                        <h1 id="title"></h1>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="refresh" class="icon-button" type="button" aria-label="Refresh">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                            <path d="M21 3v5h-5" />
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                            <path d="M8 16H3v5" />
                        </svg>
                    </button>
                    <button id="close" type="button" aria-label="Close">
                        <span class="close-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </header>
            <nav id="tabs"></nav>
            <div id="notice" role="status" aria-live="polite" hidden></div>
            <div id="workspace" class="catalog-view">
                <section id="content"></section>
                <aside id="details" aria-live="polite"></aside>
            </div>
        </main>
        <aside id="testDriveHud" hidden role="status">
            <div><span id="testDriveLabel"></span><strong id="testDriveTime"></strong></div>
            <p><kbd>G</kbd> <span id="testDriveFinish"></span></p>
        </aside>
        <dialog id="checkout">
            <form method="dialog">
                <h2 id="confirmTitle"></h2>
                <p id="summary"></p>
                <p id="quoteColor" hidden></p>
                <label id="methodLabel" for="method"></label
                ><select id="method"></select>
                <p id="checkoutError" role="alert"></p>
                <div class="actions">
                    <button id="cancel" value="cancel"></button
                    ><button id="confirm" type="button" class="primary"></button
                    ><button id="checkStatus" type="button" hidden></button>
                </div>
            </form>
        </dialog>
        <iframe id="timed-rentals" src="rentals/index.html" title="Vehicle rentals"></iframe>
        <script src="app.js"></script>
        <script src="rentals/bridge.js"></script>
    </body>
</html>
